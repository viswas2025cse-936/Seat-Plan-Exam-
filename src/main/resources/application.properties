spring.application.name=Seat-Plan
server.port=8080

# Default In-Memory / Embedded File Database (H2) for zero-setup execution
spring.datasource.url=jdbc:h2:file:./data/seatplandb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Enable H2 Web Console at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Jackson JSON Formatter
spring.jackson.serialization.indent-output=true

# Logging
logging.level.com.example.Seat.Plan=INFO
